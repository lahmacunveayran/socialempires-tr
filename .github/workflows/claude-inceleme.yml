name: claude-inceleme

# Her PR'da değişen kodu Claude API'ye kalite ve hata açısından inceletir (araclar/pr_inceleme.py).
# Gerekli: ANTHROPIC_API_KEY secret'ı ve INCELEME_MODELI değişkeni. Ücret API kredisinden düşer;
# Claude Code kullanım hakkına dokunmaz (S-45).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Yalnızca belge değişen PR'lar incelenmez (kredi boşa gitmesin).
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Aynı PR'a yeni commit gelirse eski inceleme iptal edilir.
concurrency:
  group: claude-inceleme-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  inceleme:
    # Taslak PR'lar, Dependabot PR'ları ve fork'tan gelen PR'lar incelenmez
    # (son ikisinde secret gelmez). PR'ı açana bakılır, koşuyu tetikleyene değil.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bağımlılık
        run: pip install anthropic==2.3.0
      - name: İnceleme
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # Model, depo değişkeni INCELEME_MODELI'nden gelir (CLAUDE.md: depo dosyalarına model adı yazılmaz).
          MODEL: ${{ vars.INCELEME_MODELI }}
        run: python araclar/pr_inceleme.py
