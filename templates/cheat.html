<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <title>Social Emperors - Hile Paneli</title>
    <link rel="shortcut icon" href="img/icon.gif"/>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f3ead7; color: #3b2a17; margin: 0; }
        .kutu { max-width: 760px; margin: 40px auto; background: #fffaf0; border: 2px solid #9e7747; border-radius: 10px; padding: 24px; }
        h1 { margin: 0 0 6px; font-size: 22px; }
        .alt { color: #7a5a35; font-size: 13px; margin-bottom: 18px; }
        .satir { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
        button { background: #ffd966; border: 1px solid #9e7747; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
        button:hover { background: #ffe89a; }
        input[type=number] { width: 110px; padding: 7px; border: 1px solid #9e7747; border-radius: 6px; }
        h2 { font-size: 15px; margin: 20px 0 4px; border-bottom: 1px solid #e0cba8; padding-bottom: 4px; }
        #gunluk { background: #2b1d0e; color: #ffd966; padding: 12px; border-radius: 6px; min-height: 40px; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
        a { color: #7a4b12; }
    </style>
</head>
<body>
<div class="kutu">
    <h1>Hile Paneli</h1>
    <div class="alt">
        {{ save_info.name }} &middot; seviye {{ save_info.level }} &middot; {{ version }} &middot;
        yalnızca bu bilgisayardan erişilebilir &middot; <a href="/play.html">oyuna dön</a>
    </div>

    <h2>Kaynak ekle</h2>
    <div class="satir">
        <input id="miktar" type="number" value="1000" min="1" step="1000"/>
        <button onclick="kaynak('wood')">+ Odun</button>
        <button onclick="kaynak('stone')">+ Taş</button>
        <button onclick="kaynak('food')">+ Yemek</button>
        <button onclick="kaynak('coins')">+ Altın</button>
        <button onclick="kaynak('cash')">+ Nakit</button>
    </div>

    <h2>Seviye</h2>
    <div class="satir">
        <button onclick="gonder({islem:'seviye', delta:1})">+1 seviye</button>
        <button onclick="gonder({islem:'seviye', delta:5})">+5 seviye</button>
        <button onclick="gonder({islem:'max_seviye'})">Maksimum seviye</button>
    </div>

    <h2>Diğer</h2>
    <div class="satir">
        <button onclick="gonder({islem:'egitim'})">Eğitimi atla</button>
        <button onclick="gonder({islem:'kalkan', saat:12})">12 saat kalkan</button>
        <button onclick="gonder({islem:'yedek'})">Şimdi yedek al</button>
    </div>

    <h2>Sonuç</h2>
    <div id="gunluk">Hazır.</div>
</div>

<script>
function kaynak(tur) {
    const miktar = parseInt(document.getElementById('miktar').value || '1000', 10);
    gonder({islem: 'kaynak', tur: tur, miktar: miktar});
}

async function gonder(veri) {
    const kutu = document.getElementById('gunluk');
    kutu.textContent = 'İşleniyor...';
    try {
        const cevap = await fetch('/cheat/uygula', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(veri)
        });
        const json = await cevap.json();
        if (!cevap.ok) {
            kutu.textContent = 'Hata: ' + (json.hata || cevap.status);
            return;
        }
        kutu.textContent = JSON.stringify(json, null, 2);
    } catch (e) {
        kutu.textContent = 'Bağlantı hatası: ' + e;
    }
}
</script>
</body>
</html>
